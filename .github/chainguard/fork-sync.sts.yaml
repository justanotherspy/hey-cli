# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json

# Fork-only: lets the "Sync fork with upstream" workflow on main mint a
# short-lived token to merge basecamp/hey-cli into this fork's main.
#
# Workflows write is needed because upstream commits often touch
# .github/workflows, which GITHUB_TOKEN can never push.
#
# The scheduled and manual runs both run on refs/heads/main, so this matches
# exactly. This repository issues GitHub's immutable subject, which carries the
# owner's and the repository's numeric IDs (justanotherspy@4822513,
# hey-cli@1414174170); the name-only form is refused with a 403.
issuer: https://token.actions.githubusercontent.com
subject: repo:justanotherspy@4822513/hey-cli@1414174170:ref:refs/heads/main

permissions:
  contents: write
  workflows: write
